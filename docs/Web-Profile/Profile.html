<!DOCTYPE html>




<html lang="en">




<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="../Assets/Symbols/Symbol_1.png">

    <title>1889 I.E.N.A SP My Profile</title>

    <link rel="stylesheet" href="Profile_Style.css">

</head>




<body>


    <div class="Profile_Layout">


        <header class="Profile_Header">
            <button class="Back_Btn" onclick="location.href='../Web-Redirect/Redirect.html'">BACK</button>
            <h2 class="Page_Title">S PROTOCOL PROFILE</h2>
            <img src="../Assets/Symbols/Symbol_1.png" alt="Logo" class="Profile_Logo">
        </header>


        <main class="Profile_Grid">
            

            <section class="Info_Card">
                <div class="Card_Label">IDENTITY INFORMATION</div>
                <div class="Data_List" id="Normal_Data">
                </div>
            </section>


            <section class="Info_Card">
                <div class="Card_Label">1889 DOCUMENT</div>
                <div class="Data_List" id="Service_Data">
                </div>
            </section>


            <section class="Permissions_Card">
                <div class="Card_Label">SECURITY CLEARANCE</div>
                <table class="Permissions_Table">
                    <thead>
                        <tr>
                            <th>AUTHORITY</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="Permissions_Body">
                    </tbody>
                </table>
            </section>


            <section class="Bio_Card">
                <div class="Card_Label">BIOGRAPHY</div>
                <div class="Bio_Text" id="Bio_Content">
                </div>
            </section>


        </main>


        <footer class="Profile_Footer">
            1889 I.E.N.A
        </footer>

        
    </div>

    <script src="Profile_Script.js"></script>

</body>
